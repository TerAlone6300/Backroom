name: Compile

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Secrets (Settings > Secrets and variables > Actions):
#   JKS_BASE64          keystore file encoded as base64
#   KEYSTORE_PASSWORD   keystore password
#   KEY_ALIAS           key alias inside the keystore
#   KEY_PASSWORD        key password (optional: defaults to KEYSTORE_PASSWORD)
# Without JKS_BASE64 (forks, PRs) the build still works: unsigned JAR + debug APK.

jobs:
  desktop:
    name: Desktop JAR
    runs-on: ubuntu-latest
    env:
      JKS_BASE64: ${{ secrets.JKS_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install kotlinc
        run: |
          curl -sL https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip -o kotlin.zip
          unzip -q kotlin.zip -d "$HOME"
          echo "$HOME/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Build backrooms.jar
        run: kotlinc app/src/main/java/Core.kt desktop/Desktop.kt -include-runtime -d backrooms.jar
      - name: Decode keystore
        if: ${{ env.JKS_BASE64 != '' }}
        run: echo "$JKS_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Sign JAR
        if: ${{ env.JKS_BASE64 != '' }}
        run: |
          jarsigner -keystore "$RUNNER_TEMP/release.jks" \
            -storepass "$KEYSTORE_PASSWORD" -keypass "${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" \
            -tsa http://timestamp.digicert.com \
            backrooms.jar "$KEY_ALIAS"
          jarsigner -verify backrooms.jar
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: backrooms-desktop-jar
          path: backrooms.jar

  android:
    name: Android APK
    runs-on: ubuntu-latest
    env:
      JKS_BASE64: ${{ secrets.JKS_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Decode keystore
        if: ${{ env.JKS_BASE64 != '' }}
        run: echo "$JKS_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed release APK
        if: ${{ env.JKS_BASE64 != '' }}
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
        run: gradle assembleRelease --no-daemon
      - name: Build debug APK (no signing secrets)
        if: ${{ env.JKS_BASE64 == '' }}
        run: gradle assembleDebug --no-daemon
      - name: Verify APK signature
        if: ${{ env.JKS_BASE64 != '' }}
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/*.apk
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: backrooms-android-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
