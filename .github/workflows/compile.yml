name: Compile

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    name: Desktop JAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install kotlinc
        run: |
          curl -sL https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip -o kotlin.zip
          unzip -q kotlin.zip -d "$HOME"
          echo "$HOME/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Build backrooms.jar
        run: kotlinc app/src/main/java/Core.kt desktop/Desktop.kt -include-runtime -d backrooms.jar
      - uses: actions/upload-artifact@v4
        with:
          name: backrooms-desktop-jar
          path: backrooms.jar

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: backrooms-android-apk
          path: app/build/outputs/apk/debug/*.apk
